name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 196 assertions in jsdom
        run: npm test
