name: 功能建议
description: 想要新特效、新参数或更好的交互
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: 想要什么
      description: 一句话说清，再补充细节
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么
      description: 解决什么问题或带来什么体验
    validations:
      required: false
